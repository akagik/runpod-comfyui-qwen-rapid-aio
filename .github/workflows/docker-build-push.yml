name: Build and publish container

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/runpod-comfyui-qwen-rapid-aio

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate source tree
        run: |
          set -euo pipefail
          make validate

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push linux/amd64 image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Inspect published image
        id: inspect
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          index_json="$(docker buildx imagetools inspect --raw "$IMAGE_REF")"
          platform_digest="$(
            jq -r '
              .manifests[]
              | select(.platform.os == "linux" and .platform.architecture == "amd64")
              | select((.annotations["vnd.docker.reference.type"] // "") != "attestation-manifest")
              | .digest
            ' <<<"$index_json" | head -n 1
          )"
          test -n "$platform_digest"
          manifest_json="$(docker buildx imagetools inspect --raw "${REGISTRY}/${IMAGE_NAME}@${platform_digest}")"
          compressed_bytes="$(jq '[.config.size, (.layers[].size)] | add' <<<"$manifest_json")"
          test "$compressed_bytes" -gt 0
          echo "platform_digest=$platform_digest" >> "$GITHUB_OUTPUT"
          echo "compressed_bytes=$compressed_bytes" >> "$GITHUB_OUTPUT"

      - name: Publish build summary
        run: |
          echo '### Published image' >> "$GITHUB_STEP_SUMMARY"
          echo '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'Index digest: `${{ steps.build.outputs.digest }}`' >> "$GITHUB_STEP_SUMMARY"
          echo 'linux/amd64 digest: `${{ steps.inspect.outputs.platform_digest }}`' >> "$GITHUB_STEP_SUMMARY"
          echo 'Compressed bytes: `${{ steps.inspect.outputs.compressed_bytes }}`' >> "$GITHUB_STEP_SUMMARY"

